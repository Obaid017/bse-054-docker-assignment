<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Study Planner</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
    </header>

    <form id="task-form" class="task-form">
      <label class="field grow">
        <span>Task</span>
        <input id="title" type="text" placeholder="Read chapter 4 of Operating Systems" required maxlength="80" />
      </label>
      <label class="field">
        <span>Subject</span>
        <input id="subject" type="text" placeholder="DevOps" maxlength="30" />
      </label>
      <label class="field">
        <span>Due date</span>
        <input id="due" type="date" />
      </label>
      <button type="submit" class="btn-add">Add task</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="open">To do</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks here. Add your first task above.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
